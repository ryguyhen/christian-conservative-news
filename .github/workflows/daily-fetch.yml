name: Daily News Ingest

on:
  schedule:
    - cron: '0 11 * * *'   # 6 a.m. EST / 11:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: Run a single source only
        required: false
      dry_run:
        description: Set to "1" for a dry run (no DB writes)
        required: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ingestion
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.source }}" ]; then
            ARGS="$ARGS --source \"${{ inputs.source }}\""
          fi
          if [ "${{ inputs.dry_run }}" = "1" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval "npm run ingest -- $ARGS"
